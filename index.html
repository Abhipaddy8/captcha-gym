<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captcha Gym</title>
<script src="tiles.js"></script>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1f2328; --mute:#6b7280; --line:#d0d7de; --blue:#1a73e8; --ok:#1e8e3e; --bad:#d93025; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding:16px; text-align:center; }
  header h1 { margin:0 0 4px; font-size:20px; }
  header p { margin:0; color:var(--mute); font-size:13px; }
  nav { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; padding:0 16px 12px; }
  nav a { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); text-decoration:none; font-size:13px; }
  nav a.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  main { display:flex; flex-direction:column; align-items:center; gap:16px; padding:0 16px 32px; }
  .robot { width:304px; height:78px; border:1px solid var(--line); border-radius:3px; background:#f9f9f9; display:flex; align-items:center; gap:12px; padding:0 12px; box-shadow:0 0 4px rgba(0,0,0,.08); }
  .robot .box { width:28px; height:28px; border:2px solid #c1c1c1; border-radius:2px; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ok); font-size:22px; font-weight:700; }
  .card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .prompt { background:var(--blue); color:#fff; padding:16px; margin:7px; }
  .prompt small { display:block; font-size:13px; opacity:.9; }
  .prompt b { display:block; font-size:22px; }
  .body { padding:0 7px; position:relative; }
  .grid { display:grid; gap:4px; }
  .tile { position:relative; aspect-ratio:1; cursor:pointer; overflow:hidden; background:#ddd; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .12s, opacity .4s; }
  .tile.sel img { transform:scale(.8); }
  .tile.sel::after { content:"✓"; position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--blue); color:#fff; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .tile.fade img { opacity:0; }
  .foot { display:flex; justify-content:space-between; align-items:center; padding:10px 7px; border-top:1px solid var(--line); margin-top:8px; }
  .foot .icons button { background:none; border:0; font-size:18px; cursor:pointer; color:var(--mute); }
  .btn { background:var(--blue); color:#fff; border:0; border-radius:2px; padding:10px 22px; font-weight:600; cursor:pointer; text-transform:uppercase; font-size:14px; }
  .msg { min-height:20px; padding:0 7px; font-size:13px; color:var(--bad); }
  .stage { position:relative; width:100%; touch-action:none; user-select:none; }
  .stage canvas { width:100%; display:block; }
  .piece { position:absolute; top:0; left:0; pointer-events:none; }
  .track { position:relative; height:40px; margin:10px 0 0; background:#eef1f4; border:1px solid var(--line); border-radius:20px; touch-action:none; }
  .track .knob { position:absolute; top:-1px; left:0; width:56px; height:40px; border-radius:20px; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; cursor:grab; font-size:18px; }
  .track span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:13px; pointer-events:none; }
  .rotwrap { display:flex; justify-content:center; padding:10px 0; }
  .rotwrap .circle { width:200px; height:200px; border-radius:50%; overflow:hidden; border:3px solid var(--line); }
  .rotwrap img { width:100%; height:100%; object-fit:cover; }
  .dot { position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; background:var(--blue); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  input.text { width:100%; padding:10px; font-size:18px; border:1px solid var(--line); border-radius:3px; margin-top:8px; }
  .result { width:100%; max-width:400px; padding:14px; border-radius:4px; font-weight:600; text-align:center; display:none; }
  .result.ok { display:block; background:#e6f4ea; color:var(--ok); }
  .result.bad { display:block; background:#fce8e6; color:var(--bad); }
  .log { width:100%; max-width:400px; font:12px/1.5 ui-monospace, Menlo, monospace; color:var(--mute); }
  .log table { width:100%; border-collapse:collapse; }
  .log td, .log th { border-bottom:1px solid var(--line); padding:3px 4px; text-align:left; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1115; --card:#1a1d23; --ink:#e6e6e6; --mute:#9aa0a6; --line:#30363d; } .robot { background:#1a1d23 !important; } }
  :root[data-theme="dark"] { --bg:#0f1115; --card:#1a1d23; --ink:#e6e6e6; --mute:#9aa0a6; --line:#30363d; }
</style>
</head>
<body>
<header>
  <h1>Captcha Gym</h1>
  <p>Practice puzzles for agents. Solve by looking at the page, not by reading the source.</p>
</header>
<nav id="nav"></nav>
<main>
  <div id="app" style="display:contents"></div>
  <div id="result" class="result" role="status"></div>
  <div class="log"><table><thead><tr><th>#</th><th>type</th><th>result</th><th>secs</th></tr></thead><tbody id="log"></tbody></table></div>
</main>
<script>
const TYPES = {
  grid:    "Pick images (3×3)",
  dynamic: "Pick images, tiles refill",
  slider:  "Slide the piece",
  rotate:  "Rotate upright",
  text:    "Type the text",
  order:   "Click in order",
};
const LABEL = { bicycle:"bicycles", bus:"buses", car:"cars", crosswalk:"crosswalks", hydrant:"fire hydrants", motorcycle:"motorcycles", traffic_light:"traffic lights", palm:"palm trees", bridge:"bridges", chimney:"chimneys" };
const TARGETS = Object.keys(LABEL);
const params = new URLSearchParams(location.search);
let type = TYPES[params.get("type")] ? params.get("type") : "grid";
const app = document.getElementById("app");
const resultEl = document.getElementById("result");
window.gymLog = [];
let started = 0;

const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const src = (c, f) => `img/${c}/${f}`;
const tileOf = c => ({ c, f: pick(TILES[c]) });
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

function nav() {
  const n = document.getElementById("nav"); n.innerHTML = "";
  for (const [k, v] of Object.entries(TYPES)) {
    const a = el("a", k === type ? "on" : "", v); a.href = "?type=" + k; n.append(a);
  }
  const r = el("a", "", "Random"); r.href = "?type=" + pick(Object.keys(TYPES)); n.append(r);
}

function finish(ok, note) {
  const secs = ((Date.now() - started) / 1000).toFixed(1);
  window.gymLog.push({ type, ok, secs: +secs, note: note || "" });
  const row = el("tr", "", `<td>${window.gymLog.length}</td><td>${type}</td><td style="color:var(${ok ? "--ok" : "--bad"})">${ok ? "PASS" : "FAIL"}</td><td>${secs}</td>`);
  document.getElementById("log").prepend(row);
  resultEl.className = "result " + (ok ? "ok" : "bad");
  resultEl.textContent = ok ? "Captcha passed. A new one has loaded." : "Captcha failed" + (note ? ": " + note : "") + ". A new one has loaded.";
  resultEl.dataset.status = ok ? "pass" : "fail";
  setTimeout(load, 900);
}

function shell(promptSmall, promptBig, promptTail) {
  const card = el("div", "card");
  card.append(el("div", "prompt", `<small>${promptSmall}</small><b>${promptBig}</b>${promptTail ? `<small>${promptTail}</small>` : ""}`));
  const body = el("div", "body"); card.append(body);
  const msg = el("div", "msg"); card.append(msg);
  const foot = el("div", "foot", `<div class="icons"><button title="New challenge" aria-label="New challenge">⟳</button></div>`);
  const btn = el("button", "btn", "Verify"); foot.append(btn); card.append(foot);
  foot.querySelector("button").onclick = load;
  return { card, body, msg, btn };
}

// 1) Static 3x3 grid: select all images with X
function grid() {
  const target = pick(TARGETS);
  const nTrue = 3 + rnd(3);
  const others = Object.keys(TILES).filter(c => c !== target && !(target === "motorcycle" && c === "bicycle") && !(target === "bicycle" && c === "motorcycle"));
  const cells = shuffle([...Array(nTrue)].map(() => tileOf(target)).concat([...Array(9 - nTrue)].map(() => tileOf(pick(others)))));
  const s = shell("Select all images with", LABEL[target], "Click verify once there are none left.");
  const g = el("div", "grid"); g.style.gridTemplateColumns = "repeat(3,1fr)";
  cells.forEach((t, i) => {
    const d = el("div", "tile"); d.dataset.i = i; d.append(Object.assign(new Image(), { src: src(t.c, t.f), alt: "" }));
    d.onclick = () => d.classList.toggle("sel"); g.append(d);
  });
  s.body.append(g);
  s.btn.onclick = () => {
    const sel = [...g.children].map(d => d.classList.contains("sel"));
    if (!sel.some(Boolean)) { s.msg.textContent = "Please select all matching images."; return; }
    const ok = cells.every((t, i) => (t.c === target) === sel[i]);
    finish(ok, ok ? "" : "wrong selection");
  };
  app.append(s.card);
}

// 2) Dynamic grid: clicked tiles fade out and are replaced, until none match
function dynamic() {
  const target = pick(TARGETS);
  const others = Object.keys(TILES).filter(c => c !== target);
  let cells = shuffle([...Array(4)].map(() => tileOf(target)).concat([...Array(5)].map(() => tileOf(pick(others)))));
  let wrong = 0;
  const s = shell("Select all images with", LABEL[target], "Click verify once there are none left.");
  const g = el("div", "grid"); g.style.gridTemplateColumns = "repeat(3,1fr)";
  cells.forEach((t, i) => {
    const d = el("div", "tile"); const im = Object.assign(new Image(), { src: src(t.c, t.f), alt: "" }); d.append(im);
    d.onclick = () => {
      if (d.classList.contains("fade")) return;
      if (cells[i].c !== target) wrong++;
      d.classList.add("fade");
      setTimeout(() => {
        cells[i] = Math.random() < 0.35 ? tileOf(target) : tileOf(pick(others));
        im.src = src(cells[i].c, cells[i].f);
        im.onload = () => d.classList.remove("fade");
      }, 1200 + rnd(1500));
    };
    g.append(d);
  });
  s.body.append(g);
  s.btn.onclick = () => {
    if ([...g.children].some(d => d.classList.contains("fade"))) { s.msg.textContent = "Wait for new images to load."; return; }
    const left = cells.filter(t => t.c === target).length;
    finish(left === 0 && wrong === 0, left ? `${left} matching left` : wrong ? `${wrong} wrong clicks` : "");
  };
  app.append(s.card);
}

// Shared: draw a mosaic background from dataset tiles onto a canvas
function mosaic(cols, rows, size) {
  const cv = document.createElement("canvas"); cv.width = cols * size; cv.height = rows * size;
  const ctx = cv.getContext("2d");
  const pool = Object.keys(TILES).filter(c => c !== "other");
  const jobs = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const t = tileOf(pick(pool)); const im = new Image(); im.src = src(t.c, t.f);
    jobs.push(new Promise(r => { im.onload = () => { ctx.drawImage(im, x * size, y * size, size, size); r(); }; im.onerror = r; }));
  }
  return Promise.all(jobs).then(() => cv);
}

function piecePath(ctx, x, y, s) {
  const k = s / 4;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s / 2 - k / 2, y);
  ctx.arc(x + s / 2, y, k / 2, Math.PI, 0); ctx.lineTo(x + s, y); ctx.lineTo(x + s, y + s / 2 - k / 2);
  ctx.arc(x + s, y + s / 2, k / 2, -Math.PI / 2, Math.PI / 2); ctx.lineTo(x + s, y + s); ctx.lineTo(x, y + s); ctx.closePath();
}

function dragKnob(track, max, onMove, onEnd) {
  const knob = track.querySelector(".knob"); let sx = null, pos = 0;
  knob.addEventListener("pointerdown", e => { sx = e.clientX - pos; knob.setPointerCapture(e.pointerId); knob.style.cursor = "grabbing"; });
  knob.addEventListener("pointermove", e => {
    if (sx == null) return;
    pos = Math.max(0, Math.min(max(), e.clientX - sx)); knob.style.left = pos + "px"; onMove(pos / max());
  });
  knob.addEventListener("pointerup", () => { if (sx == null) return; sx = null; knob.style.cursor = "grab"; onEnd(pos / max()); });
}

// 3) Slider jigsaw: drag the piece into the gap
async function slider() {
  const W = 360, H = 240, S = 56;
  const gx = 140 + rnd(W - S - 160), gy = 20 + rnd(H - S - 40);
  const s = shell("Complete the puzzle", "Drag the slider", "to fit the piece into the gap");
  s.btn.style.display = "none";
  const stage = el("div", "stage"); s.body.append(stage);
  app.append(s.card);
  const bg = await mosaic(3, 2, 120);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const ctx = cv.getContext("2d");
  ctx.drawImage(bg, 0, 0);
  const pc = document.createElement("canvas"); pc.width = S + S / 4; pc.height = H; pc.className = "piece";
  const pctx = pc.getContext("2d");
  pctx.save(); piecePath(pctx, 0, gy, S); pctx.clip(); pctx.drawImage(bg, gx, 0, S + S / 4, H, 0, 0, S + S / 4, H); pctx.restore();
  pctx.lineWidth = 2; pctx.strokeStyle = "rgba(255,255,255,.9)"; piecePath(pctx, 0, gy, S); pctx.stroke();
  ctx.save(); piecePath(ctx, gx, gy, S); ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fill(); ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.stroke(); ctx.restore();
  stage.append(cv, pc);
  const fit = () => { const sc = stage.clientWidth / W; pc.style.width = (pc.width * sc) + "px"; pc.style.height = (H * sc) + "px"; return sc; };
  fit(); window.addEventListener("resize", fit, { once: true });
  const track = el("div", "track", `<span>Drag to the right →</span><div class="knob">➜</div>`); s.body.append(track);
  const maxPx = () => track.clientWidth - 56;
  const toX = f => f * (W - S - S / 4);
  dragKnob(track, maxPx, f => { pc.style.transform = `translateX(${toX(f) * fit()}px)`; }, f => {
    const off = Math.abs(toX(f) - gx);
    finish(off <= 6, off <= 6 ? "" : `off by ${off.toFixed(0)}px`);
  });
}

// 4) Rotate: turn the image upright
function rotate() {
  const pool = ["bus", "car", "hydrant", "traffic_light", "palm", "chimney", "bridge", "crosswalk"];
  const t = tileOf(pick(pool));
  const start = 40 + rnd(280);
  const s = shell("Drag the slider to", "rotate the image upright", "");
  s.btn.style.display = "none";
  const wrap = el("div", "rotwrap"); const c = el("div", "circle"); const im = Object.assign(new Image(), { src: src(t.c, t.f), alt: "" });
  im.style.transform = `rotate(${start}deg)`; c.append(im); wrap.append(c); s.body.append(wrap);
  const track = el("div", "track", `<span>Drag to rotate →</span><div class="knob">⟳</div>`); s.body.append(track);
  app.append(s.card);
  const ang = f => (start + f * 360) % 360;
  dragKnob(track, () => track.clientWidth - 56, f => { im.style.transform = `rotate(${ang(f)}deg)`; }, f => {
    const a = ang(f); const off = Math.min(a, 360 - a);
    finish(off <= 12, off <= 12 ? "" : `off by ${off.toFixed(0)}°`);
  });
}

// 5) Distorted text
function text() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const answer = [...Array(5 + rnd(2))].map(() => pick([...chars])).join("");
  const s = shell("Type the characters", "you see in the image", "Not case-sensitive.");
  const cv = document.createElement("canvas"); cv.width = 360; cv.height = 110; cv.style.width = "100%";
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#eef0f3"; ctx.fillRect(0, 0, 360, 110);
  for (let i = 0; i < 300; i++) { ctx.fillStyle = `hsla(${rnd(360)},40%,50%,.25)`; ctx.fillRect(rnd(360), rnd(110), 2, 2); }
  [...answer].forEach((ch, i) => {
    ctx.save(); ctx.translate(30 + i * 52 + rnd(10), 70 + rnd(16) - 8); ctx.rotate((Math.random() - .5) * .7);
    ctx.font = `bold ${44 + rnd(10)}px Georgia, serif`; ctx.fillStyle = `hsl(${rnd(360)},55%,30%)`; ctx.fillText(ch, 0, 0); ctx.restore();
  });
  for (let i = 0; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(0, rnd(110));
    ctx.bezierCurveTo(120, rnd(110), 240, rnd(110), 360, rnd(110));
    ctx.strokeStyle = `hsla(${rnd(360)},50%,35%,.7)`; ctx.lineWidth = 2; ctx.stroke();
  }
  const inp = el("input", "text"); inp.placeholder = "Type here"; inp.autocomplete = "off"; inp.setAttribute("aria-label", "Captcha text");
  s.body.append(cv, inp);
  s.btn.onclick = () => {
    if (!inp.value.trim()) { s.msg.textContent = "Please type the characters."; return; }
    const ok = inp.value.trim().toUpperCase() === answer; finish(ok, ok ? "" : "wrong text");
  };
  inp.onkeydown = e => { if (e.key === "Enter") s.btn.click(); };
  app.append(s.card);
}

// 6) Click shapes in a given order
async function order() {
  const SHAPES = ["★", "▲", "●", "■", "♥", "◆"];
  const W = 360, H = 240;
  const chosen = shuffle(SHAPES).slice(0, 4);
  const want = shuffle(chosen).slice(0, 3);
  const pts = [];
  while (pts.length < chosen.length) {
    const p = { x: 30 + rnd(W - 60), y: 30 + rnd(H - 60) };
    if (pts.every(q => Math.hypot(q.x - p.x, q.y - p.y) > 70)) pts.push(p);
  }
  const s = shell("Click the shapes in this order", want.join("  "), "Click verify when done.");
  const stage = el("div", "stage"); s.body.append(stage); app.append(s.card);
  const bg = await mosaic(3, 2, 120);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const ctx = cv.getContext("2d");
  ctx.drawImage(bg, 0, 0);
  chosen.forEach((sh, i) => {
    ctx.save(); ctx.translate(pts[i].x, pts[i].y); ctx.rotate((Math.random() - .5) * 1.2);
    ctx.font = `bold ${34 + rnd(10)}px system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.8)"; ctx.strokeText(sh, 0, 0);
    ctx.fillStyle = `hsl(${rnd(360)},90%,65%)`; ctx.fillText(sh, 0, 0); ctx.restore();
  });
  stage.append(cv);
  const clicks = [];
  cv.onclick = e => {
    const r = cv.getBoundingClientRect(); const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
    clicks.push({ x, y });
    const d = el("div", "dot", clicks.length); d.style.left = (x * r.width / W) + "px"; d.style.top = (y * r.height / H) + "px"; stage.append(d);
  };
  s.btn.onclick = () => {
    if (clicks.length !== want.length) { s.msg.textContent = `Click exactly ${want.length} shapes.`; return; }
    const ok = want.every((sh, i) => { const p = pts[chosen.indexOf(sh)]; return Math.hypot(p.x - clicks[i].x, p.y - clicks[i].y) <= 24; });
    finish(ok, ok ? "" : "wrong order or position");
  };
}

const RUN = { grid, dynamic, slider, rotate, text, order };

// Checkbox gate in front of the image challenges, like reCAPTCHA
function load() {
  app.innerHTML = ""; nav();
  if (type === "grid" || type === "dynamic") {
    const gate = el("div", "robot", `<div class="box" role="checkbox" aria-checked="false" tabindex="0"></div><span>I'm not a robot</span>`);
    app.append(gate);
    gate.querySelector(".box").onclick = () => { gate.remove(); started = Date.now(); RUN[type](); };
  } else { started = Date.now(); RUN[type](); }
}
load();
</script>
</body>
</html>
